name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out certified upstream SDK
        uses: actions/checkout@v6
        with:
          repository: github/copilot-sdk
          ref: 2980c7828d35754bfc2b334831efec309ab8a2eb
          path: .upstream/copilot-sdk
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: 1.12.214

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: cljdeps-

      - name: Run CI
        env:
          COPILOT_SDK_UPSTREAM: ${{ github.workspace }}/.upstream/copilot-sdk
          COPILOT_UPSTREAM_VALIDATION: 'true'
        run: bb ci
